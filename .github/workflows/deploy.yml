name: Deploy inline workloads
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      stage:
        description: Target workspace stage
        required: true
        type: choice
        options: [dev, test, prod]
permissions:
  contents: read
  id-token: write
concurrency:
  group: fabric-inline-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
      FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Offline deployment preview
        run: python scripts/deploy.py --stage "$STAGE" --dry-run
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish notebook
        run: python scripts/deploy.py --stage "$STAGE"
      - name: Keep deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ inputs.stage }}-${{ github.run_id }}
          path: deployment-manifest.json
          if-no-files-found: warn
